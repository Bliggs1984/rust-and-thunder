<!doctype html>
<html><head><meta charset="utf-8"><title>Campaign - briefing</title>
<style>/*COMMON_CSS*/
.abs { position: absolute; }
#scene { position: absolute; left: 0; top: 0; }
.pf { padding: calc(var(--u) * 2); }
.pf.dim img { filter: brightness(0.45) saturate(0.6); }
.choice { display: flex; align-items: flex-start; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 4); background: var(--p1); box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--p2); }
.choice.on { background: #24200f; box-shadow: 0 0 0 var(--u) var(--line), inset 0 0 0 var(--u) var(--gold); }
.static { position: absolute; inset: calc(var(--u) * 2); pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 var(--u), transparent var(--u) calc(var(--u) * 3)); }
.nameplate { position: absolute; top: calc(var(--u) * -10); display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2) calc(var(--u) * 4); background: var(--p2); box-shadow: 0 0 0 var(--u) var(--line), inset 0 var(--u) 0 var(--p3); }
</style></head>
<body><div id="app"></div>
<script>/*COMMON_JS*/
const u = U, W = innerWidth, H = innerHeight;
// ---------- pixel scene: dusk over a wheat field near the rail line (drawn at 2u per pixel) ----------
const hash = (x) => { let h = Math.imul(x | 0, 374761393); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const PS = 2 * u, SW = Math.ceil(W / PS), SH = Math.ceil(H / PS);
function scene() {
  const a = new Art(SW, SH);
  const hz = Math.round(SH * 0.56);
  const bands = ['#141a33', '#1d2342', '#2b2a4e', '#4a3358', '#7a3f55', '#b0524a', '#d8763c', '#f0a040'];
  for (let y = 0; y < hz; y++) {
    const b = Math.min(bands.length - 1, Math.floor((y / hz) ** 1.6 * bands.length));
    for (let x = 0; x < SW; x++) {
      let c = bands[b];
      // dither only at the band seams, one row, to keep bands hard but not stripy
      if (b > 0 && Math.floor(((y - 1) / hz) ** 1.6 * bands.length) < b && (x % 2)) c = bands[b - 1];
      a.set(x, y, c);
    }
  }
  // stars
  for (let i = 0; i < 70; i++) { const x = (i * 97) % SW, y = (i * 53) % Math.round(hz * 0.4); a.set(x, y, i % 5 ? '#6a6f99' : '#f4efe2'); }
  // sun on the horizon
  a.ell(SW * 0.72, hz - 1, 13, 13, '#ffe08a', (x, y, dx, dy) => (dy < -0.55 ? '#ffe08a' : dy < -0.2 ? '#f8d060' : '#f8b800'));
  // distant smoke columns (the war is still on the horizon)
  for (const sx of [0.18, 0.86]) for (let y = hz - 30; y < hz; y++) {
    const w = 2 + (hz - y) * 0.18, x0 = SW * sx + Math.sin(y * 0.25) * 2 + (hz - y) * 0.3;
    for (let x = Math.floor(x0 - w); x < x0 + w; x++) a.set(x, y, (x + y) % 3 ? '#3a2c3c' : '#4a3a48');
  }
  // tree line silhouette
  for (let x = 0; x < SW; x++) {
    const h = 4 + Math.round(3 * Math.sin(x * 0.21) + 2 * Math.sin(x * 0.53 + 1) + (hash(x) * 2));
    for (let y = hz - h; y < hz + 2; y++) a.set(x, y, '#1a1626');
  }
  // rail embankment + track
  for (let x = 0; x < SW; x++) { a.set(x, hz + 2, '#2a2230'); a.set(x, hz + 3, '#3a2e36'); a.set(x, hz + 4, x % 3 ? '#2a2230' : '#5a4a50'); a.set(x, hz + 5, '#2a2230'); }
  // signal post + telegraph poles
  a.rect(Math.round(SW * 0.6), hz - 22, 1, 24, '#14111c');
  a.rect(Math.round(SW * 0.6) - 1, hz - 24, 3, 4, '#14111c'); a.set(Math.round(SW * 0.6), hz - 23, '#f0482a');
  for (const px of [0.08, 0.34, 0.92]) { const x = Math.round(SW * px); a.rect(x, hz - 18, 1, 20, '#14111c'); a.rect(x - 3, hz - 17, 7, 1, '#14111c'); }
  for (let x = 0; x < SW; x++) a.set(x, hz - 16 + Math.round(Math.abs(((x / SW * 4) % 1) - 0.5) * 3), '#14111c');
  // wheat field in hard bands, stalks on top
  const field = ['#5a3a1c', '#7a4e20', '#9a6a28', '#b88a34', '#c89a3c'];
  for (let y = hz + 6; y < SH; y++) {
    const b = Math.min(field.length - 1, Math.floor((y - hz - 6) / (SH - hz - 6) * field.length * 1.3));
    for (let x = 0; x < SW; x++) {
      let c = field[b];
      if ((x * 7 + y * 3) % 11 === 0) c = field[Math.min(field.length - 1, b + 1)];
      if ((x * 5 + y * 13) % 17 === 0) c = '#3a2410';
      a.set(x, y, c);
    }
  }
  // tank silhouette on the field (side view), crew sitting on the turret
  const tx = Math.round(SW * 0.43), ty = hz + 18;
  const K = '#120e16', K2 = '#221a22';
  a.rect(tx, ty, 44, 6, K); a.rect(tx + 2, ty + 6, 40, 4, K); // hull + tracks
  for (let i = 0; i < 7; i++) a.ell(tx + 5 + i * 5.6, ty + 8, 2.2, 2.2, K2);
  a.rect(tx + 12, ty - 6, 18, 6, K); a.rect(tx + 14, ty - 8, 12, 2, K); // turret
  a.rect(tx + 30, ty - 5, 24, 2, K); a.rect(tx + 52, ty - 6, 3, 4, K); // barrel + muzzle brake
  a.rect(tx + 8, ty - 3, 6, 3, K); a.rect(tx + 4, ty - 2, 3, 2, K); // bolted plates, jerry can
  a.rect(tx + 18, ty - 14, 3, 6, K); a.ell(tx + 19.5, ty - 16, 2, 2, K); // crew member
  a.rect(tx + 24, ty - 13, 3, 5, K); a.ell(tx + 25.5, ty - 15, 2, 2, K);
  a.rect(tx + 15, ty - 19, 1, 6, K); // antenna
  // sunflowers in the foreground
  for (const [fx, fy] of [[0.1, 0.84], [0.16, 0.9], [0.83, 0.86], [0.9, 0.93], [0.27, 0.95]]) {
    const x = Math.round(SW * fx), y = Math.round(SH * fy);
    a.rect(x, y, 1, SH - y, '#2a4a1a'); a.rect(x - 2, y + 5, 2, 1, '#3a6a24');
    a.ell(x + 0.5, y, 3.2, 3.2, '#f8b800', (px, py, dx, dy) => (dx * dx + dy * dy < 0.25 ? '#5a3a1c' : dx + dy < -0.5 ? '#ffe08a' : '#f8b800'));
  }
  return a;
}

const LINES = [
  ['KOVAL', 'GOOD WORK IN THE FIELDS. THE FARMERS SAY THANK YOU, AND PLEASE STOP DRIVING THROUGH THE SUNFLOWERS.', 'old'],
  ['TRACTOR', 'TELL THEM THE SUNFLOWERS STARTED IT.', 'old'],
  ['KOVAL', 'NEXT IS STARYI MLYN JUNCTION. THEY MOVE ARMOUR BY TRAIN, AT NIGHT, WITH THE LIGHTS ON. NOBODY HERE KNOWS WHY EITHER.', 'now'],
];
const CHOICES = [
  ['1', '"WE\'LL DERAIL IT FROM THE FOREST."', '+1 AMBUSH CHARGE', 'ambush'],
  ['2', '"SEND US DRONES. WE\'LL DO THE REST."', '+2 FPV CHARGES', 'fpv'],
  ['3', '"IS THE STATION EMPTY?"', 'ASK FIRST', null],
];
const S2 = Math.max(S.md, 3);
const line = ([who, text, st]) => `<div class="row" style="align-items:flex-start;gap:${4 * u}px">
  <span style="width:${textW('TRACTOR', S.md) + 2 * u}px;flex:none">${T(who, S.md, st === 'old' ? 'c-mute' : who === 'KOVAL' ? 'c-blue' : 'c-gold')}</span>
  <div style="flex:1">${P(text, st === 'now' ? S.lg : S.md, st === 'now' ? 'c-ink' : 'c-mute')}${st === 'now' ? `<span class="cursor" style="display:inline-block;margin-top:${2 * u}px">${T('▶', S.md, 'c-gold')}</span>` : ''}</div></div>`;

const boxH = 108 * u;
const PORT = 4 * u;
document.getElementById('app').innerHTML = `
${img(scene(), PS, '', '').replace('<img', '<img id="scene"')}
<div class="scan"></div>
<div class="abs col" style="left:${8 * u}px;top:${8 * u}px;gap:${3 * u}px">
  <span class="row" style="gap:${3 * u}px"><span class="tag">${T('REGION I FREED', S.sm)}</span>${T('3 TOWNS · 3 DEPOTS · BOSS DOWN', S.sm, 'c-ink sh')}</span>
  <span class="sh">${T('BRIEFING · RAIL JUNCTION', S.xl, 'steel')}</span>
</div>
<div class="abs hints sh" style="right:${8 * u}px;top:${10 * u}px">${hints([[['ESC'], 'HOLD TO SKIP']])}</div>
<div class="abs plate pf" style="left:${16 * u}px;bottom:${boxH + 8 * u}px">${portrait('koval', PORT)}<div class="static"></div></div>
<div class="abs plate pf dim" style="right:${16 * u}px;bottom:${boxH + 8 * u}px">${portrait('mykola', PORT, '', 'transform:scaleX(-1)')}</div>
<div class="abs plate riv" style="left:${8 * u}px;right:${8 * u}px;bottom:${8 * u}px;height:${boxH - 8 * u}px;display:grid;grid-template-columns:1fr ${200 * u}px;gap:${8 * u}px;padding:${6 * u}px">
  <div class="nameplate" style="left:${16 * u}px">${icon('signal', u)}${T('MAJOR KOVAL', S.md, 'c-blue')}${T('HQ · CH 1', S.sm, 'c-dim')}</div>
  <div class="nameplate" style="right:${16 * u}px">${T('MYKOLA "TRACTOR"', S.md, 'c-mute')}</div>
  <div class="col" style="gap:${5 * u}px;justify-content:flex-end">${LINES.map(line).join('')}</div>
  <div class="col" style="gap:${4 * u}px;justify-content:flex-end">
    ${T('YOUR ANSWER', S.sm, 'c-mute')}
    ${CHOICES.map(([k, t, r, ic], i) => `<div class="choice ${i === 0 ? 'on' : ''}">${kc(k, i === 0 ? 'gold' : '')}<div class="col" style="gap:${2 * u}px">${P(t, S.sm, i === 0 ? 'c-ink' : 'c-dim')}
      <span class="row" style="gap:${2 * u}px">${ic ? icon(ic, 2) : ''}${T(r, S.sm, ic ? 'c-green' : 'c-blue')}</span></div></div>`).join('')}
  </div>
</div>`;
ready();
</script></body></html>
