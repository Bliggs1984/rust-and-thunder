<!doctype html>
<html><head><meta charset="utf-8"><title>Campaign HUD</title>
<style>/*COMMON_CSS*/
#view { position: absolute; inset: 0; overflow: hidden; }
#view > img.bg { position: absolute; }
.abs { position: absolute; }
/* HUD plates float over the map: a little see-through, crisp pixel edges */
.plate.glass { background-color: rgba(24, 26, 31, 0.86); }
.vsep { align-self: stretch; width: var(--u); flex: none; background: var(--line); box-shadow: var(--u) 0 0 var(--p3); margin: 0 var(--u) 0 0; }
.ab { position: relative; min-width: calc(var(--u) * 26); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); }
.ab .btn { position: relative; width: calc(var(--u) * 26); height: calc(var(--u) * 26); display: flex; align-items: center; justify-content: center; }
.ab .btn.ready1 { box-shadow: 0 0 0 var(--u) var(--line), inset 0 0 0 var(--u) var(--gold), inset calc(var(--u) * 2) calc(var(--u) * 2) 0 #2a2410; background: #181a1e; }
.ab .btn.ready0 { box-shadow: 0 0 0 var(--u) var(--line), inset 0 0 0 var(--u) var(--steel), inset calc(var(--u) * 2) calc(var(--u) * 2) 0 #262a30; background: #181a1e; }
.ab .key { position: absolute; left: calc(var(--u) * -2); top: calc(var(--u) * -2); }
.ab .key2 { position: absolute; right: calc(var(--u) * -2); top: calc(var(--u) * -2); }
.ab .cnt { position: absolute; right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); }
.ab .ovl { position: absolute; inset: var(--u); }
.ab .mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.ab.dim .btn img.ic { opacity: 0.35; }
.mini { position: relative; height: calc(var(--u) * 2); background: #15171b; box-shadow: 0 0 0 var(--u) var(--line); }
.mini b { position: absolute; left: 0; top: 0; bottom: 0; }
.mini::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(var(--u) * 3), var(--line) calc(var(--u) * 3) calc(var(--u) * 4)); }
</style></head>
<body><div id="app"></div>
<script>/*COMMON_JS*/
/*VARS*/
const u = U, W = innerWidth, H = innerHeight;
const TWO = PLAYERS === 2;

// ---------- the game view fills the window ----------
// Campaign keeps the arcade's pixel scale but widens the native view to the window's aspect: 224 native px
// tall on wide windows (about 400x224 at 16:9), 256 wide on windows narrower than 8:7 (256x455 at 9:16).
const tall = W / H < 256 / 224;
const s = tall ? W / 256 : H / 224;            // screen px per native px
const NW = W / s, NH = H / s;                  // native view size
const BG = tall ? { src: 'IMG(bg-tall-1p.png)', w: 256, h: 456 }
  : TWO ? { src: 'IMG(bg-wide-2p.png)', w: 400, h: 224 } : { src: 'IMG(bg-wide-1p.png)', w: 400, h: 224 };
const ox = Math.round((W - BG.w * s) / 2), oy = Math.round((H - BG.h * s) / 2);
const V = (x, y) => [ox + x * s, oy + y * s]; // backdrop native px -> screen px
const M = 4 * u; // margin from the window edge

// ---------- pieces ----------
const PLAYER = [
  { tag: 'IP', name: 'BABUSYA', colour: 'gold', armour: 7, vet: 2, xp: 7, parts: { armour: 1, engine: 1, tracks: 1, plough: 1 } },
  { tag: 'IIP', name: 'DIDO', colour: 'green', armour: 3, vet: 1, xp: 4, parts: { armour: 1, barrel: 1, jammer: 1 } },
];
// tank card: sprite, tag + name + veterancy, armour, XP. In co-op the words ARMOUR / VET are dropped and
// player 2's card is mirrored so both tanks sit at the outer ends of the cluster.
function unitCard(i) {
  const p = PLAYER[i], mirror = TWO && i === 1, words = !TWO;
  const rev = mirror ? 'flex-direction:row-reverse;' : '';
  const chev = Array.from({ length: 3 }, (_, k) => icon('chev', u, '', k < p.vet ? null : { g: 'd', h: 'm', o: 'y' })).join('');
  const low = p.armour <= 3;
  const arm = segs(10, p.armour, 4, 5, i ? 'green' : '', low ? Object.fromEntries(Array.from({ length: p.armour }, (_, k) => [k, 'warn'])) : {});
  return `<div class="row" style="gap:${4 * u}px;${rev}">
    <div class="plate ${i ? 'own2' : 'own1'}" style="padding:${2 * u}px">${img(tankArt(p.parts, p.colour), u)}</div>
    <div class="col" style="gap:${3 * u}px;align-items:${mirror ? 'flex-end' : 'flex-start'}">
      <div class="row" style="gap:${3 * u}px;${rev}"><span class="tag ${i ? 'p2' : ''}">${T(p.tag, S.sm)}</span>${T(p.name, S.md, 'c-ink')}<span class="row" style="gap:${u}px">${chev}</span></div>
      <div class="row" style="gap:${3 * u}px;${rev}">${words ? T('ARMOUR', S.sm, 'c-dim') : ''}${arm}${T(`${p.armour}/10`, S.md, low ? 'c-red' : 'c-ink')}</div>
      <div class="row" style="gap:${3 * u}px;${rev}">${words ? T('VET', S.sm, 'c-mute') : ''}${segs(12, p.xp, 3, 2, 'blue')}</div>
    </div>
  </div>`;
}
// ability charges are shared by both tanks, so co-op shows one set of buttons with both players' keys:
// player 1's keycap top-left, player 2's d-pad direction top-right
const ABIL = [
  { icon: 'fpv', label: 'DRONE', key: '1', pad: 'up', n: 2, state: 'ready' },
  { icon: 'ambush', label: 'AMBUSH', key: '2', pad: 'left', n: 1, state: 'ready' },
  { icon: 'recon', label: 'RECON', key: '3', pad: 'right', n: 1, state: 'cool', frac: 0.35, secs: '6' },
  { icon: 'repair', label: 'PATCH', key: '4', pad: 'down', cost: '-15', state: 'ready' },
];
const labels = !(TWO && u < 3);
function abilityBtn(a) {
  const keys = `<span class="key">${kc(a.key)}</span>` + (TWO ? `<span class="key2">${icon('dpad', u, '', { dir: a.pad, color: 'green' })}</span>` : '');
  const ready = a.state === 'ready' ? (TWO ? 'ready0' : 'ready1') : '';
  const cnt = a.cost ? `<span class="cnt ol">${T(a.cost, S.sm, 'c-ink')}</span>` : a.n !== undefined ? `<span class="cnt ol">${T('x' + a.n, S.sm, a.n ? 'c-ink' : 'c-red')}</span>` : '';
  const cd = a.state === 'cool' ? `<img class="ovl" src="${sweepArt(24, a.frac).url(1)}" style="width:${24 * u}px;height:${24 * u}px"><span class="mid ol">${T(a.secs, S.lg, 'c-ink')}</span>` : '';
  return `<div class="ab ${a.state === 'empty' ? 'dim' : ''}">
    <div class="btn well ${ready}">${icon(a.icon, u, 'ic')}${cd}${keys}${cnt}</div>
    ${labels ? T(a.label, S.sm, a.state === 'ready' ? 'c-ink' : 'c-mute') : ''}
  </div>`;
}
const abilities = () => `<div class="row" style="gap:${(TWO ? 6 : 5) * u}px;align-items:flex-start;padding-top:${u}px">${ABIL.map(abilityBtn).join('')}</div>`;
// the command cluster: one compact plate that hugs its contents, bottom centre
const cluster = () => `<div class="plate glass row" style="gap:${5 * u}px;padding:${3 * u}px ${4 * u}px">
  ${unitCard(0)}<i class="vsep"></i>${abilities()}${TWO ? `<i class="vsep"></i>${unitCard(1)}` : ''}</div>`;

function objectives() {
  const houses = Array.from({ length: 5 }, (_, k) => icon('house', u, '', k < 2 ? null : { g: 'd', w: 'y' })).join('');
  return `<div class="plate glass" style="padding:${3 * u}px ${4 * u}px">
    <div class="hdr" style="margin:${-3 * u}px ${-4 * u}px ${3 * u}px;padding:${2 * u}px ${4 * u}px">${T('OBJECTIVES', S.sm, 'c-gold')}<span class="row" style="gap:${u}px">${houses}</span></div>
    <div class="col" style="gap:${3 * u}px">
      <div class="row" style="align-items:flex-start;gap:${3 * u}px">${icon('diamond', u, 'cursor')}<div class="col" style="gap:${2 * u}px">
        ${T('FREE TYKHE POLE', S.md, 'c-gold')}
        <div class="row" style="gap:${2 * u}px">${img(ringArt(9, 0.6), u)}${T('60% · 2 TANKS LEFT', S.sm, 'c-ink')}</div></div></div>
      <div class="row" style="gap:${3 * u}px">${icon('diamond', u, '', { g: 'm', h: 'l', o: 'd' })}${T('DEPOTS 1/3', S.md, 'c-dim')}</div>
      <div class="row" style="gap:${3 * u}px">${img(iconArt('lock'), u, '', 'opacity:.6')}${T('BOSS · FREE 3 TOWNS', S.sm, 'c-mute')}</div>
    </div>
  </div>`;
}
// scrap and parts, with the pause key tucked in at the end
const resources = () => `<div class="plate flat glass row" style="gap:${6 * u}px;padding:${2 * u}px ${4 * u}px">
  ${resource('scrap', '245')}${resource('parts', '3')}<i class="vsep"></i><span class="row" style="gap:${2 * u}px">${kc('ESC')}${T('PAUSE', S.sm, 'c-dim')}</span></div>`;
function radio(width) {
  return `<div class="plate glass" style="width:${width}px;padding:${3 * u}px">
    <div class="row" style="align-items:flex-start;gap:${3 * u}px">
      <div class="well" style="padding:0">${portrait('yurko', u)}</div>
      <div class="col" style="gap:${3 * u}px;flex:1">
        <div class="row" style="justify-content:space-between">${T('SPANNER', S.md, 'c-gold')}<span class="row" style="gap:${2 * u}px">${T('CH 4', S.sm, 'c-mute')}${icon('signal', u)}</span></div>
        ${P('WEST DEPOT IS FULL OF DIESEL. ONE SHELL AND BOOM.', S.sm, 'c-ink')}</div>
    </div>
  </div>`;
}

// ---------- minimap: the real test region (img/region.png, 4 px per cell, 208x208 cells) ----------
const TOWNS = [
  { name: 'TYKHE POLE', c: [40, 36], st: 'enemy' },
  { name: 'ZOLOTA BALKA', c: [128, 50], st: 'enemy' },
  { name: 'STARI SADY', c: [164, 110], st: 'fog' },
  { name: 'VYSHNEVE', c: [44, 145], st: 'free' },
  { name: 'KALYNIVKA', c: [112, 168], st: 'free' },
];
const DEPOTS = [{ c: [30, 112], done: true }, { c: [78, 113] }, { c: [183, 187] }];
const ME = [[54, 64], [60, 66]];
function minimap(n) {
  return new Promise((res) => {
    const im = new Image();
    im.onload = () => {
      const src = document.createElement('canvas'); src.width = 832; src.height = 832;
      const sg = src.getContext('2d'); sg.drawImage(im, 0, 0);
      const D = sg.getImageData(0, 0, 832, 832).data;
      const a = new Art(n, n);
      const k = 208 / n;
      const TER = { ground: '#3e4c2a', tree: '#26361c', water: '#2a4a7a', brick: '#9a6a44', steel: '#8a919b', ice: '#9ab8c8' };
      const classify = (r, g, b) => (b > 150 && r > 150 ? 'ice' : b > 140 ? 'water' : r > 170 && g < 120 ? 'brick' : r > 130 && g > 130 && b > 140 ? 'steel' : g < 100 && r < 60 ? 'tree' : 'ground');
      const sector = (x, y) => { let best = 0, bd = 1e9; TOWNS.forEach((t, i) => { const d = (t.c[0] - x) ** 2 + (t.c[1] - y) ** 2; if (d < bd) { bd = d; best = i; } }); return best; };
      const sec = [];
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const cx = (x + 0.5) * k, cy = (y + 0.5) * k;
        const i = ((Math.floor(cy * 4)) * 832 + Math.floor(cx * 4)) * 4;
        const t = classify(D[i], D[i + 1], D[i + 2]);
        sec[y * n + x] = sector(cx, cy);
        let col = TER[t];
        const st = TOWNS[sec[y * n + x]].st;
        if (st === 'fog') col = mix(col, '#0c0d10', 0.65);
        else if (st === 'enemy') col = mix(col, '#f0482a', 0.14);
        else col = mix(col, '#f8b800', 0.16);
        a.set(x, y, col);
      }
      // sector borders (dotted)
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const me = sec[y * n + x];
        const edge = (x + 1 < n && sec[y * n + x + 1] !== me) || (y + 1 < n && sec[(y + 1) * n + x] !== me);
        if (edge && (x + y) % 2 === 0) a.set(x, y, '#c6ccd4');
      }
      const mark = (c, col, size = 3) => { const x = Math.round(c[0] / k), y = Math.round(c[1] / k), h = size >> 1; a.rect(x - h - 1, y - h - 1, size + 2, size + 2, '#0b0c0e'); a.rect(x - h, y - h, size, size, col); };
      TOWNS.forEach((t) => { if (t.st !== 'fog') mark(t.c, t.st === 'free' ? '#f8b800' : '#f0482a'); });
      DEPOTS.forEach((d) => { if (!d.done) { const x = Math.round(d.c[0] / k), y = Math.round(d.c[1] / k); a.rows(x - 2, y - 2, ['r...r', '.r.r.', '..r..', '.r.r.', 'r...r']); } });
      // camera rectangle: the view is NW x NH native px = NW/4 x NH/4 cells
      const cam = TWO ? [(ME[0][0] + ME[1][0]) / 2, (ME[0][1] + ME[1][1]) / 2] : ME[0];
      const rw = Math.round(NW / 4 / k), rh = Math.round(NH / 4 / k), rx = Math.round(cam[0] / k - rw / 2), ry = Math.round(cam[1] / k - rh / 2);
      for (let x = rx; x <= rx + rw; x++) { a.set(x, ry, '#f4efe2'); a.set(x, ry + rh, '#f4efe2'); }
      for (let y = ry; y <= ry + rh; y++) { a.set(rx, y, '#f4efe2'); a.set(rx + rw, y, '#f4efe2'); }
      (TWO ? ME : [ME[0]]).forEach((m, i) => mark(m, i ? '#7cd83a' : '#ffe08a', 2));
      res(a);
    };
    im.src = 'IMG(region.png)';
  });
}
function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function minimapPlate(art) {
  return `<div class="plate glass" style="padding:${3 * u}px">
    <div class="hdr" style="margin:${-3 * u}px ${-3 * u}px ${3 * u}px;padding:${2 * u}px ${3 * u}px">${T('FARMLAND', S.sm, 'c-gold')}<span class="row" style="gap:${2 * u}px">${kc('TAB')}${u < 3 ? '' : T('MAP', S.sm, 'c-dim')}</span></div>
    <div class="well" style="padding:0">${img(art, u)}</div>
  </div>`;
}

// ---------- in-world markers (backdrop native coordinates) ----------
// anchor (ax, ay): which point of the marker sits on the spot, 0..1 of its width / height
const marker = (x, y, html, ax = 0.5, ay = 0.5) => { const [px, py] = V(x, y); return `<div class="abs" data-x="${px}" data-y="${py}" data-ax="${ax}" data-ay="${ay}">${html}</div>`; };
const tankBar = (n, col, tag, p2) => `<div class="col" style="align-items:center;gap:${2 * u}px">
  ${tag ? `<span class="tag ${p2 ? 'p2' : ''}">${T(tag, S.sm)}</span>` : ''}
  <div class="mini" style="width:${16 * u}px"><b style="width:${n * 10}%;background:${col}"></b></div></div>`;
const capture = (pct) => `<div class="col" style="align-items:center;gap:${2 * u}px">
  <div style="position:relative">${img(ringArt(22, pct / 100), u)}<div class="abs" style="left:${3 * u}px;top:${3 * u}px">${icon('flag', u)}</div></div>
  <span class="ol">${T(`FREEING ${pct}%`, S.sm, 'c-gold')}</span></div>`;
const drone = `<div class="row ol" style="gap:${2 * u}px">${icon('fpv', u, 'blink', { l: 'r', w: 'h', m: 'q' })}${T('DRONE!', S.md, 'c-red')}</div>`;
function worldMarkers() {
  if (tall) {
    // portrait backdrop: region-c with 90 rows of ground above it
    return marker(119.5, 90 + 112, tankBar(7, 'var(--gold)'), 0.5, 1)
      + marker(134.5, 90 + 18, capture(60))
      + marker(108, 2, drone, 0.5, 0);
  }
  if (!TWO) {
    // your tank (191.5, 122) between the brick blocks, an enemy above right, the walled square to free up top
    return marker(191.5, 112, tankBar(7, 'var(--gold)'), 0.5, 1)
      + marker(206.5, 18, capture(60))
      + marker(262, 2, drone, 0.5, 0);
  }
  return marker(176, 108, tankBar(7, 'var(--gold)', 'IP'), 0.5, 1)
    + marker(200, 108, tankBar(3, 'var(--red)', 'IIP', true), 0.5, 1)
    + marker(188, 52, capture(25))
    + marker(118, 2, drone, 0.5, 0);
}

// ---------- assemble ----------
minimap(80).then((mm) => {
  let html = `<div id="view"><img class="bg" src="${BG.src}" style="left:${ox}px;top:${oy}px;width:${BG.w * s}px;height:${BG.h * s}px"></div>${worldMarkers()}`;
  html += `<div class="abs" style="left:${M}px;top:${M}px">${objectives()}</div>`;
  html += `<div class="abs" style="right:${M}px;top:${M}px">${resources()}</div>`;
  html += `<div class="abs" id="cl" data-center="1" style="bottom:${M}px">${cluster()}</div>`;
  html += `<div class="abs" id="mm" style="left:${M}px;bottom:${M}px">${minimapPlate(mm)}</div>`;
  html += `<div class="abs" id="rd" style="right:${M}px;bottom:${M}px">${radio(Math.max(112 * u, 300))}</div>`;
  document.getElementById('app').innerHTML = html;
  // whole-pixel placement: centre the cluster and anchor the world markers without sub-pixel offsets
  const cl = document.getElementById('cl');
  cl.style.left = Math.round((W - cl.offsetWidth) / 2) + 'px';
  document.querySelectorAll('[data-ax]').forEach((el) => {
    el.style.left = Math.round(+el.dataset.x - +el.dataset.ax * el.offsetWidth) + 'px';
    el.style.top = Math.round(+el.dataset.y - +el.dataset.ay * el.offsetHeight) + 'px';
  });
  // minimap and radio sit beside the cluster; where there isn't room (portrait, co-op at 720p) they move up
  // to sit on top of it instead
  const up = M + cl.offsetHeight + 4 * u;
  const mp = document.getElementById('mm'), rd = document.getElementById('rd');
  if (mp.offsetLeft + mp.offsetWidth + 4 * u > cl.offsetLeft) mp.style.bottom = up + 'px';
  if (rd.offsetLeft < cl.offsetLeft + cl.offsetWidth + 4 * u) rd.style.bottom = up + 'px';
  ready();
});
</script></body></html>
