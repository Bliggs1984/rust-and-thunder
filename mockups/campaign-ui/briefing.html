<style>/* Campaign UI design system. One UI pixel = --u screen px (3 at 1080p, 2 at 720p); every size below is

  --line: #0b0c0e;
  --p0: #121418;  /* plate shadow edge */
  --p1: #1c1f24;  /* plate body */
  --p2: #2b2f36;  /* raised / header */
  --p3: #4a4f58;  /* plate highlight edge */
  --well: #101215; /* sunken wells */
  --rivet: #6a707a;
  --ink: #f4efe2;
  --dim: #9aa0a8;
  --mute: #5d636c;
  --gold: #f8b800;
  --gold-hi: #ffe08a;
  --orange: #c87000;
  --rust: #983000;
  --red: #f0482a;
  --red-dk: #7a1a10;
  --green: #7cd83a;
  --green-dk: #3a8a10;
  --blue: #6c9cff;
  --blue-dk: #3050c0;
  --steel: #c6ccd4;

.px { display: inline-flex; vertical-align: middle; line-height: 0; white-space: nowrap; flex: none; }
.px i { display: inline-block; flex: none; background: currentColor; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; }
/* banded fills: stops sit on glyph rows (7 lit rows of 8) so each band is whole pixels */
.px.gold i { background: linear-gradient(180deg, var(--gold-hi) 0 25%, var(--gold) 25% 62.5%, var(--orange) 62.5% 100%); }
.px.steel i { background: linear-gradient(180deg, #ffffff 0 25%, var(--steel) 25% 62.5%, #7c838e 62.5% 100%); }
.px.redb i { background: linear-gradient(180deg, #ffb09a 0 25%, var(--red) 25% 62.5%, var(--rust) 62.5% 100%); }
.para { display: flex; flex-wrap: wrap; align-items: flex-start; }
.c-gold { color: var(--gold); } .c-dim { color: var(--dim); } .c-mute { color: var(--mute); }
.c-red { color: var(--red); } .c-green { color: var(--green); } .c-ink { color: var(--ink); }
.c-blue { color: var(--blue); } .c-hi { color: var(--gold-hi); } .c-dark { color: #1a1000; }

.sh { filter: drop-shadow(var(--u) var(--u) 0 #000); }
.ol { filter: drop-shadow(var(--u) 0 0 #000) drop-shadow(calc(var(--u) * -1) 0 0 #000) drop-shadow(0 var(--u) 0 #000) drop-shadow(0 calc(var(--u) * -1) 0 #000); }

  background-color: var(--p1);
  padding: calc(var(--u) * 4);

    0 0 0 var(--u) var(--line),
    inset var(--u) var(--u) 0 var(--p3),
    inset calc(var(--u) * -1) calc(var(--u) * -1) 0 var(--p0),
    calc(var(--u) * 2) calc(var(--u) * 2) 0 var(--u) rgba(0, 0, 0, 0.5);

.plate.riv::after {
  content: ''; position: absolute; inset: calc(var(--u) * 2); pointer-events: none;
  background:
    linear-gradient(var(--rivet), var(--rivet)) left top / var(--u) var(--u) no-repeat,
    linear-gradient(var(--rivet), var(--rivet)) right top / var(--u) var(--u) no-repeat,
    linear-gradient(var(--rivet), var(--rivet)) left bottom / var(--u) var(--u) no-repeat,
    linear-gradient(var(--rivet), var(--rivet)) right bottom / var(--u) var(--u) no-repeat;
}
.plate.flat { box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--p3), inset calc(var(--u) * -1) calc(var(--u) * -1) 0 var(--p0); }
/* P1 / P2 ownership: a 1-pixel coloured rim inside the outline */

  margin: calc(var(--u) * -4) calc(var(--u) * -4) calc(var(--u) * 4);

.tag.blue { background: var(--blue); color: #08112a; box-shadow: 0 0 0 var(--u) var(--line), inset calc(var(--u) * -1) calc(var(--u) * -1) 0 var(--blue-dk); }

.kc { display: inline-flex; align-items: center; justify-content: center; padding: var(--u) calc(var(--u) * 2); min-width: calc(var(--u) * 9); background: var(--p2); color: var(--ink);
  box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--p3), inset calc(var(--u) * -1) calc(var(--u) * -2) 0 #15171a; padding-bottom: calc(var(--u) * 2); }
.kc.gold { background: var(--gold); color: #1a1000; box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--gold-hi), inset calc(var(--u) * -1) calc(var(--u) * -2) 0 var(--orange); }

/* segmented bars */

.segs i { display: block; background: #2a2e35; box-shadow: 0 0 0 var(--u) var(--line); }
.segs i.on { background: var(--gold); box-shadow: 0 0 0 var(--u) var(--line), inset 0 calc(var(--u) * -1) 0 var(--orange), inset 0 var(--u) 0 var(--gold-hi); }
.segs.green i.on { background: var(--green); box-shadow: 0 0 0 var(--u) var(--line), inset 0 calc(var(--u) * -1) 0 var(--green-dk), inset 0 var(--u) 0 #c4f59a; }
.segs.blue i.on { background: var(--blue); box-shadow: 0 0 0 var(--u) var(--line), inset 0 calc(var(--u) * -1) 0 var(--blue-dk), inset 0 var(--u) 0 #b8d0ff; }
.segs i.warn { background: var(--red); box-shadow: 0 0 0 var(--u) var(--line), inset 0 calc(var(--u) * -1) 0 var(--red-dk); }
.segs i.gain { background: var(--green); box-shadow: 0 0 0 var(--u) var(--line), inset 0 calc(var(--u) * -1) 0 var(--green-dk); }
.segs i.loss { background: #3a1410; box-shadow: 0 0 0 var(--u) var(--line), inset 0 0 0 var(--u) var(--red); }

.row { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.col { display: flex; flex-direction: column; gap: calc(var(--u) * 3); }

.tabs { display: flex; align-items: center; gap: calc(var(--u) * 3); }
.tab { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 6); background: var(--p1); color: var(--mute);
  box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--p2); }

#scene { position: absolute; left: 0; top: 0; }
.pf { padding: calc(var(--u) * 2); }

.choice { display: flex; align-items: flex-start; gap: calc(var(--u) * 3); padding: calc(var(--u) * 3) calc(var(--u) * 4); background: var(--p1); box-shadow: 0 0 0 var(--u) var(--line), inset var(--u) var(--u) 0 var(--p2); }
.choice.on { background: #24200f; box-shadow: 0 0 0 var(--u) var(--line), inset 0 0 0 var(--u) var(--gold); }
.static { position: absolute; inset: calc(var(--u) * 2); pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 var(--u), transparent var(--u) calc(var(--u) * 3)); }
.nameplate { position: absolute; top: calc(var(--u) * -10); display: flex; align-items: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 2) calc(var(--u) * 4); background: var(--p2); box-shadow: 0 0 0 var(--u) var(--line), inset 0 var(--u) 0 var(--p3); }

  return `<img class="${cls}" src="${art.url(1)}" style="width:${art.w * scale}px;height:${art.h * scale}px;${style}">`;
}

const iconCache = {};
function iconArt(name, remap = null) {
  const key = name + JSON.stringify(remap || {});
  if (iconCache[key]) return iconCache[key];
  let a;
  if (ICON_SRC[name]) a = fromRows(ICON_SRC[name], remap ? Object.fromEntries(Object.entries(remap).map(([k, v]) => [k, PAL[v] || v])) : {});
  else a = PROC[name](remap);
  iconCache[key] = a;
  return a;
}
function icon(name, scale = U, cls = '', remap = null, style = '') { return img(iconArt(name, remap), scale, cls, style); }

// procedural icons
const PROC = {
  scrap(remap) { // hex nut
    const a = new Art(16, 16);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const px = x + 0.5 - 8, py = y + 0.5 - 8;
      const hex = Math.max(Math.abs(py) * 1.15, Math.abs(px) * 0.58 + Math.abs(py) * 0.58);
      if (hex > 6.6) continue;
      const r = Math.hypot(px, py);
      if (r < 2.4) continue;
      let c = PAL.l;
      if (r < 3.5) c = px + py > 0 ? PAL.w : PAL.d; // hole bevel (lit from top-left)
      else if (px + py < -6) c = PAL.w;
      else if (px + py > 4) c = PAL.m;
      if (hex > 5.6 && px + py > 2) c = PAL.d;
      a.set(x, y, c);
    }
    return a.outline();
  },
  parts() { // cog
    const a = new Art(16, 16);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const px = x + 0.5 - 8, py = y + 0.5 - 8;
      const r = Math.hypot(px, py), ang = Math.atan2(py, px);
      const tooth = Math.cos(ang * 8) > 0.25;
      if (r > (tooth ? 7 : 5.2) || r < 2) continue;
      let c = PAL.g;
      if (r < 3) c = px + py > 0 ? PAL.h : PAL.R;
      else if (px + py < -4) c = PAL.h;
      else if (px + py > 3.5) c = PAL.o;
      a.set(x, y, c);
    }
    return a.outline();
  },
  repair() { // spanner
    const a = new Art(16, 16);
    a.line(3.5, 12.5, 10, 6, 1.3, PAL.l);
    a.ell(11, 5, 3.6, 3.6, PAL.l);
    a.ell(3, 13, 2, 2, PAL.l);
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const px = x + 0.5 - 11, py = y + 0.5 - 5;
      if (Math.hypot(px, py) < 2 && true) a.set(x, y, null);
      if (px - py > 1 && px + py < 3 && px + py > -3 && px > 0) a.set(x, y, null); // jaw opening up-right
    }
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (a.get(x, y)) {
      if (!a.get(x + 1, y + 1) || !a.get(x, y + 1)) a.set(x, y, PAL.m);
      if (!a.get(x - 1, y - 1) && a.get(x, y) === PAL.l) a.set(x, y, PAL.w);
    }
    return a.outline();
  },
  mine() {
    const a = new Art(12, 12);
    for (const [x, y] of [[5, 0], [6, 0], [0, 5], [0, 6], [11, 5], [11, 6], [5, 11], [6, 11], [1, 1], [10, 1], [1, 10], [10, 10]]) a.set(x, y, PAL.m);
    a.ell(6, 6, 4.6, 4.6, PAL.d, (x, y, dx, dy) => (dx + dy < -0.6 ? PAL.m : dx + dy > 0.7 ? PAL.y : PAL.d));
    a.set(5, 5, PAL.r); a.set(6, 5, PAL.r);
    return a.outline();
  },
  tank16(remap) { // small top-down tank for map markers
    const col = remap?.body || 'gold';
    const C = col === 'green' ? [PAL.G, '#c4f59a', PAL.n] : col === 'red' ? [PAL.r, '#ffb09a', PAL.q] : [PAL.g, PAL.h, PAL.o];
    const a = new Art(16, 16);
    for (let y = 3; y <= 14; y++) { a.rect(1, y, 4, 1, y % 2 ? PAL.m : PAL.d); a.rect(11, y, 4, 1, y % 2 ? PAL.m : PAL.d); }
    a.rect(4, 4, 8, 10, C[0]); a.rect(4, 4, 8, 1, C[1]); a.rect(4, 13, 8, 1, C[2]);
    a.ell(8, 9.5, 3.2, 3.2, C[0], (x, y, dx, dy) => (dx + dy < -0.5 ? C[1] : dx + dy > 0.6 ? C[2] : C[0]));
    a.rect(7, 0, 2, 7, PAL.l); a.set(8, 1, PAL.m); a.set(8, 2, PAL.m);
    return a.outline();
  },
  dpad(remap) { // 11x11 d-pad, remap.dir = up/left/right/down highlights one arm
    const a = new Art(11, 11);
    const hi = remap?.color === 'green' ? [PAL.G, PAL.n] : [PAL.g, PAL.o];
    a.rect(4, 1, 3, 9, PAL.d); a.rect(1, 4, 9, 3, PAL.d);
    const arms = { up: [4, 1, 3, 3], down: [4, 7, 3, 3], left: [1, 4, 3, 3], right: [7, 4, 3, 3] };
    if (remap?.dir) { const [x, y, w, h] = arms[remap.dir]; a.rect(x, y, w, h, hi[0]); }
    a.set(5, 5, PAL.y);
    return a.outline();
  },
};

// ---------- tank art (32x32, top-down, parts bolted on) ----------
function tankArt(parts = {}, colour = 'gold') {
  const C = colour === 'green'
    ? { b: PAL.G, h: '#c4f59a', s: PAL.n, d: PAL.N }
    : { b: PAL.g, h: PAL.h, s: PAL.o, d: PAL.R };
  const a = new Art(32, 32);
  // treads
  const tw = parts.tracks ? 7 : 6;
  for (const sx of [9 - tw, 23]) {
    for (let y = 5; y <= 30; y++) {
      for (let x = sx; x < sx + tw; x++) {
        let c = (y % 2) ? PAL.m : PAL.d;
        if (x === sx || x === sx + tw - 1) c = (y % 2) ? PAL.d : PAL.y;
        if (y === 5 || y === 30) c = PAL.y;
        a.set(x, y, c);
      }
      if (parts.tracks && y % 3 === 0) { a.set(sx - 1, y, PAL.l); a.set(sx + tw, y, PAL.l); }
    }
  }
  // hull
  for (let y = 8; y <= 28; y++) for (let x = 9; x <= 22; x++) {
    let c = C.b;
    if (y === 8 || x === 9) c = C.h;
    if (y === 28 || x === 22) c = C.s;
    a.set(x, y, c);
  }
  // engine deck (rear)
  for (let y = 24; y <= 27; y++) for (let x = 11; x <= 20; x++) a.set(x, y, (x % 2) ? C.s : C.d);
  if (parts.engine) {
    for (let y = 24; y <= 27; y++) for (let x = 11; x <= 20; x++) a.set(x, y, (x % 2) ? PAL.m : PAL.y);
    a.rect(10, 28, 2, 3, PAL.l); a.set(10, 30, PAL.y); a.set(11, 30, PAL.y);
    a.rect(20, 28, 2, 3, PAL.l); a.set(20, 30, PAL.y); a.set(21, 30, PAL.y);
  }
  // armour: mismatched steel plates bolted to the front and a rusty one on the side
  if (parts.armour) {
    a.rect(9, 8, 14, 3, PAL.l); a.rect(9, 10, 14, 1, PAL.m);
    [10, 13, 18, 21].forEach((x) => a.set(x, 9, PAL.d));
    a.rect(9, 13, 2, 7, PAL.R); a.set(9, 14, PAL.d); a.set(9, 18, PAL.d);
    a.rect(21, 15, 2, 6, PAL.m); a.set(22, 16, PAL.d); a.set(22, 19, PAL.d);
  }
  // turret
  a.ell(15.5, 17, 7, 6.6, PAL.k);
  a.ell(15.5, 17, 6, 5.6, C.b, (x, y, dx, dy) => (dx + dy < -0.6 ? C.h : dx + dy > 0.6 ? C.s : C.b));
  a.ell(18, 19.5, 1.7, 1.7, C.d); a.set(17, 19, C.s);
  // plough in front of the tracks
  if (parts.plough) {
    a.rect(3, 3, 26, 2, PAL.m); a.rect(3, 3, 26, 1, PAL.l);
    for (let x = 3; x <= 28; x += 3) { a.set(x, 1, PAL.m); a.set(x, 2, PAL.m); }
  }
  // barrel
  const top = parts.barrel ? 0 : 3;
  for (let y = top; y <= 12; y++) { a.set(15, y, PAL.l); a.set(16, y, PAL.m); }
  if (parts.barrel) { a.rect(14, 0, 4, 2, PAL.m); a.rect(14, 0, 4, 1, PAL.l); a.rect(14, 6, 4, 2, PAL.m); a.set(14, 6, PAL.l); }
  // jammer: radio box + whip antennas
  if (parts.jammer) {
    a.rect(19, 20, 3, 3, PAL.y); a.set(20, 21, PAL.r);
    a.line(21.5, 20.5, 26, 13, 0.4, PAL.k);
  }
  return a.outline();
}

// ---------- portraits (32x32) ----------
const SKIN = {
  light: ['#f4c8a0', '#e0a878', '#b07850'], mid: ['#e8b088', '#c88a60', '#9a6040'], tan: ['#d8a070', '#b47c50', '#845434'],
};
function portraitArt(p) {
  const a = new Art(32, 32);
  const [sk, sm, sd] = SKIN[p.skin || 'mid'];
  const hair = p.hair || ['#5a3a1a', '#3a2410'];
  const cl = p.clothes || ['#5a6a3a', '#3e4a28'];
  // torso
  for (let y = 24; y < 32; y++) {
    const hw = Math.min(15, 8 + (y - 24) * 1.4);
    for (let x = 0; x < 32; x++) {
      const d = x + 0.5 - 16;
      if (Math.abs(d) > hw) continue;
      a.set(x, y, d > hw - 4 ? cl[1] : cl[0]);
    }
  }
  // collar / shirt
  if (p.collar) for (let y = 24; y < 29; y++) for (let x = 13; x <= 18; x++) if (Math.abs(x + 0.5 - 16) < (y - 23) * 0.8) a.set(x, y, p.collar);
  // neck
  a.rect(13, 20, 6, 5, sm);
  a.rect(13, 23, 6, 1, sd);
  // head
  const cx = 16, cy = 13.5;
  for (let y = 4; y < 23; y++) for (let x = 6; x < 26; x++) {
    const dx = (x + 0.5 - cx) / 6.7;
    const dy = (y + 0.5 - cy) / 8.2;
    const jaw = y > 17 ? 1 + (y - 17) * 0.09 : 1;
    if ((dx * jaw) ** 2 + dy * dy > 1) continue;
    let c = sk;
    if (dx > 0.62) c = sm;
    if (dx < -0.7) c = sm;
    if (y >= 20) c = sm;
    a.set(x, y, c);
  }
  // ears
  a.rect(8, 13, 2, 3, sm); a.set(8, 14, sd);
  a.rect(23, 13, 2, 3, sm); a.set(24, 14, sd);
  // eyes + brows
  const eyeY = 14;
  a.set(11, eyeY, '#ffffff'); a.set(12, eyeY, '#1a1410');
  a.set(19, eyeY, '#1a1410'); a.set(20, eyeY, '#ffffff');
  a.set(11, eyeY + 1, sm); a.set(12, eyeY + 1, sm); a.set(19, eyeY + 1, sm); a.set(20, eyeY + 1, sm);
  const brow = p.brow || hair[1];
  a.rect(10, eyeY - 2, 4, 1, brow); a.rect(18, eyeY - 2, 4, 1, brow);
  if (p.frown) { a.set(13, eyeY - 1, brow); a.set(18, eyeY - 1, brow); }
  // nose
  a.set(16, 15, sm); a.set(16, 16, sm); a.set(15, 17, sd); a.set(16, 17, sd);
  // mouth
  const lip = '#8a3a2a';
  if (p.smile) { a.rect(14, 19, 4, 1, lip); a.set(13, 18, lip); a.set(18, 18, lip); }
  else a.rect(14, 19, 4, 1, lip);
  if (p.blush) { a.set(10, 17, '#e88a78'); a.set(21, 17, '#e88a78'); }
  if (p.freckles) [[11, 16], [13, 17], [19, 16], [21, 17]].forEach(([x, y]) => a.set(x, y, sd));
  if (p.wrinkles) { a.set(10, 15, sd); a.set(21, 15, sd); a.set(13, 20, sd); a.set(18, 20, sd); }
  if (p.extra) p.extra(a, { sk, sm, sd, hair, cl });
  // silhouette outline against the background, then background
  a.outline();
  const out = new Art(32, 32);
  const bg = p.bg || ['#2b2f36', '#22252b'];
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) out.set(x, y, y < 22 ? bg[0] : bg[1]);
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { const v = a.get(x, y); if (v) out.set(x, y, v); }
  return out;
}

// ---------- pixel cooldown sweep / progress ring ----------
/** n x n overlay: the part of a clock wipe not yet recharged is darkened (frac = recharged 0..1) */
function sweepArt(n, frac) {
  const a = new Art(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const ang = (Math.atan2(x + 0.5 - n / 2, -(y + 0.5 - n / 2)) / (Math.PI * 2) + 1) % 1;
    if (ang >= frac) a.set(x, y, 'rgba(6,7,9,0.72)');
  }
  // bright edge on the wipe line
  for (let r = 1; r < n / 2; r++) {
    const t = frac * Math.PI * 2;
    a.set(Math.floor(n / 2 + Math.sin(t) * r), Math.floor(n / 2 - Math.cos(t) * r), 'rgba(255,224,138,0.9)');
  }
  return a;
}
/** ring of `segs` blocks, `on` of them lit */
function ringArt(n, frac, on = PAL.g, off = PAL.y) {
  const a = new Art(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const dx = x + 0.5 - n / 2, dy = y + 0.5 - n / 2, r = Math.hypot(dx, dy);
    if (r > n / 2 - 0.2 || r < n / 2 - 2.6) continue;
    const ang = (Math.atan2(dx, -dy) / (Math.PI * 2) + 1) % 1;
    const seg = Math.floor(ang * 16);
    if ((ang * 16) % 1 < 0.14) continue;
    a.set(x, y, seg < Math.round(frac * 16) ? on : off);
  }
  return a.outline();
}

// ---------- pixel scene: dusk over a wheat field near the rail line (drawn at 2u per pixel) ----------
const hash = (x) => { let h = Math.imul(x | 0, 374761393); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const PS = 2 * u, SW = Math.ceil(W / PS), SH = Math.ceil(H / PS);
function scene() {
  const a = new Art(SW, SH);
  const hz = Math.round(SH * 0.56);
  const bands = ['#141a33', '#1d2342', '#2b2a4e', '#4a3358', '#7a3f55', '#b0524a', '#d8763c', '#f0a040'];
  for (let y = 0; y < hz; y++) {
    const b = Math.min(bands.length - 1, Math.floor((y / hz) ** 1.6 * bands.length));
    for (let x = 0; x < SW; x++) {
      let c = bands[b];
      // dither only at the band seams, one row, to keep bands hard but not stripy
      if (b > 0 && Math.floor(((y - 1) / hz) ** 1.6 * bands.length) < b && (x % 2)) c = bands[b - 1];
      a.set(x, y, c);
    }
  }
  // stars
  for (let i = 0; i < 70; i++) { const x = (i * 97) % SW, y = (i * 53) % Math.round(hz * 0.4); a.set(x, y, i % 5 ? '#6a6f99' : '#f4efe2'); }
  // sun on the horizon
  a.ell(SW * 0.72, hz - 1, 13, 13, '#ffe08a', (x, y, dx, dy) => (dy < -0.55 ? '#ffe08a' : dy < -0.2 ? '#f8d060' : '#f8b800'));
  // distant smoke columns (the war is still on the horizon)
  for (const sx of [0.18, 0.86]) for (let y = hz - 30; y < hz; y++) {
    const w = 2 + (hz - y) * 0.18, x0 = SW * sx + Math.sin(y * 0.25) * 2 + (hz - y) * 0.3;
    for (let x = Math.floor(x0 - w); x < x0 + w; x++) a.set(x, y, (x + y) % 3 ? '#3a2c3c' : '#4a3a48');
  }
  // tree line silhouette
  for (let x = 0; x < SW; x++) {
    const h = 4 + Math.round(3 * Math.sin(x * 0.21) + 2 * Math.sin(x * 0.53 + 1) + (hash(x) * 2));
    for (let y = hz - h; y < hz + 2; y++) a.set(x, y, '#1a1626');
  }
  // rail embankment + track
  for (let x = 0; x < SW; x++) { a.set(x, hz + 2, '#2a2230'); a.set(x, hz + 3, '#3a2e36'); a.set(x, hz + 4, x % 3 ? '#2a2230' : '#5a4a50'); a.set(x, hz + 5, '#2a2230'); }
  // signal post + telegraph poles
  a.rect(Math.round(SW * 0.6), hz - 22, 1, 24, '#14111c');
  a.rect(Math.round(SW * 0.6) - 1, hz - 24, 3, 4, '#14111c'); a.set(Math.round(SW * 0.6), hz - 23, '#f0482a');
  for (const px of [0.08, 0.34, 0.92]) { const x = Math.round(SW * px); a.rect(x, hz - 18, 1, 20, '#14111c'); a.rect(x - 3, hz - 17, 7, 1, '#14111c'); }
  for (let x = 0; x < SW; x++) a.set(x, hz - 16 + Math.round(Math.abs(((x / SW * 4) % 1) - 0.5) * 3), '#14111c');
  // wheat field in hard bands, stalks on top
  const field = ['#5a3a1c', '#7a4e20', '#9a6a28', '#b88a34', '#c89a3c'];
  for (let y = hz + 6; y < SH; y++) {
    const b = Math.min(field.length - 1, Math.floor((y - hz - 6) / (SH - hz - 6) * field.length * 1.3));
    for (let x = 0; x < SW; x++) {
      let c = field[b];
      if ((x * 7 + y * 3) % 11 === 0) c = field[Math.min(field.length - 1, b + 1)];
      if ((x * 5 + y * 13) % 17 === 0) c = '#3a2410';
      a.set(x, y, c);
    }
  }
  // tank silhouette on the field (side view), crew sitting on the turret
  const tx = Math.round(SW * 0.43), ty = hz + 18;
  const K = '#120e16', K2 = '#221a22';
  a.rect(tx, ty, 44, 6, K); a.rect(tx + 2, ty + 6, 40, 4, K); // hull + tracks
  for (let i = 0; i < 7; i++) a.ell(tx + 5 + i * 5.6, ty + 8, 2.2, 2.2, K2);
  a.rect(tx + 12, ty - 6, 18, 6, K); a.rect(tx + 14, ty - 8, 12, 2, K); // turret
  a.rect(tx + 30, ty - 5, 24, 2, K); a.rect(tx + 52, ty - 6, 3, 4, K); // barrel + muzzle brake
  a.rect(tx + 8, ty - 3, 6, 3, K); a.rect(tx + 4, ty - 2, 3, 2, K); // bolted plates, jerry can
  a.rect(tx + 18, ty - 14, 3, 6, K); a.ell(tx + 19.5, ty - 16, 2, 2, K); // crew member
  a.rect(tx + 24, ty - 13, 3, 5, K); a.ell(tx + 25.5, ty - 15, 2, 2, K);
  a.rect(tx + 15, ty - 19, 1, 6, K); // antenna
  // sunflowers in the foreground
  for (const [fx, fy] of [[0.1, 0.84], [0.16, 0.9], [0.83, 0.86], [0.9, 0.93], [0.27, 0.95]]) {
    const x = Math.round(SW * fx), y = Math.round(SH * fy);
    a.rect(x, y, 1, SH - y, '#2a4a1a'); a.rect(x - 2, y + 5, 2, 1, '#3a6a24');
    a.ell(x + 0.5, y, 3.2, 3.2, '#f8b800', (px, py, dx, dy) => (dx * dx + dy * dy < 0.25 ? '#5a3a1c' : dx + dy < -0.5 ? '#ffe08a' : '#f8b800'));
  }
  return a;
}
